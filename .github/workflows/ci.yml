name: Healthai validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/full-supabase-cutover]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check patient frontend JavaScript
        run: |
          node --check maruthi/Health/app.js
          node --check maruthi/Health/api.js
          node --check maruthi/Health/supabase-client.js
          node --check 'maruthi/Health/api/config.js'
          node --check 'maruthi/Health/api/[...path].js'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maruthi/Health/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r maruthi/Health/backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q maruthi/Health/backend/app
      - name: Run backend tests
        working-directory: maruthi/Health/backend
        env:
          APP_ENV: test
        run: python -m pytest -q tests
